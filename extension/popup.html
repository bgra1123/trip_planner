<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TripAgent Capture</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 14px; width: 320px;
      background: #fff; color: #0f172a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #e2e8f0; }
      input { background: #1e293b; color: #e2e8f0; border-color: #334155; }
      .muted { color: #94a3b8; }
      .row { border-color: #1e293b; }
    }
    h1 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 2px; }
    .muted { color: #64748b; font-size: 11px; margin: 0 0 10px; }
    fieldset { border: 0; padding: 0; margin: 0 0 10px; display: flex; gap: 6px; }
    label { flex: 1; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: #64748b; }
    input {
      width: 100%; box-sizing: border-box; margin-top: 3px; padding: 5px 6px;
      font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
      border: 1px solid #cbd5e1; border-radius: 5px; background: #fff; color: inherit;
    }
    button {
      font: 600 11px/1 -apple-system, BlinkMacSystemFont, sans-serif;
      text-transform: uppercase; letter-spacing: .04em;
      padding: 7px 10px; border-radius: 6px; cursor: pointer; border: 1px solid #cbd5e1;
      background: #fff; color: #0f172a;
    }
    button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .status { font-size: 11px; min-height: 15px; margin-bottom: 8px; }
    .status.error { color: #dc2626; }
    .status.ok { color: #16a34a; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; }
    .row { border-top: 1px solid #e2e8f0; padding: 6px 0; font-size: 11px; }
    .row b { font-weight: 600; }
    .row span { color: #64748b; }
  </style>
</head>
<body>
  <h1>TripAgent Capture</h1>
  <p class="muted" id="subtitle">Loading…</p>

  <fieldset>
    <label>From <input id="from" placeholder="IST" maxlength="4" /></label>
    <label>To <input id="to" placeholder="MUC" maxlength="4" /></label>
    <label>Window <input id="window" placeholder="14-19 Aug" /></label>
  </fieldset>
  <p class="muted">Overrides fill in what the page URL does not say. They are saved for next time.</p>

  <div class="actions">
    <button class="primary" id="capture">Capture this page</button>
    <button id="send">Send to planner</button>
    <button id="clear">Clear</button>
  </div>

  <p class="status" id="status"></p>
  <ul id="offers"></ul>

  <script src="popup.js"></script>
</body>
</html>
