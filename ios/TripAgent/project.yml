# XcodeGen spec. On your Mac:   cd ios/TripAgent && xcodegen generate && open TripAgent.xcodeproj
name: TripAgent
options:
  bundleIdPrefix: com.bgra1123
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  TripAgent:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TripAgent
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # lets you point the app at a `wrangler dev` server on your Mac
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
  TripAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ["LinuxMain.swift"]
    dependencies:
      - target: TripAgent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
